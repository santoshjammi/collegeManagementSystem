# =====================================================
# COLLEGE MANAGEMENT SYSTEM - APACHE CONFIGURATION
# =====================================================
# Place this file in the traditional-php directory

# Enable URL rewriting
RewriteEngine On

# Set base path (adjust if installed in subdirectory)
RewriteBase /college-management-system/traditional-php/

# Handle main application routes
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.*)$ index.php [QSA,L]

# Security headers
<FilesMatch "\.(php|html|js|css)$">
    Header set X-Content-Type-Options nosniff
    Header set X-Frame-Options SAMEORIGIN
    Header set X-XSS-Protection "1; mode=block"
</FilesMatch>

# Deny access to sensitive files
<FilesMatch "(config\.php|\.sql|\.log)$">
    Order deny,allow
    Deny from all
</FilesMatch>

# Protect uploads directory (optional - adjust as needed)
<Directory "uploads/">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# PHP settings (optional)
php_value upload_max_filesize 10M
php_value post_max_size 10M
php_value max_execution_time 300
php_value memory_limit 128M

# Enable compression
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE text/xml
    AddOutputFilterByType DEFLATE text/css
    AddOutputFilterByType DEFLATE application/xml
    AddOutputFilterByType DEFLATE application/xhtml+xml
    AddOutputFilterByType DEFLATE application/rss+xml
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/x-javascript
</IfModule>

# Cache static assets
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpg "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/pdf "access plus 1 month"
    ExpiresByType text/javascript "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresDefault "access plus 2 days"
</IfModule>

# Error documents (optional)
ErrorDocument 404 /404.php
ErrorDocument 500 /500.php</content>
